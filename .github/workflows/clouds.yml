name: Live clouds

# Every hour: the newest NOAA GMGSI global infrared mosaic -> a cloud mask for the Roulette Radio globe, published on GitHub Pages,
# with NOAA SWPC's aurora forecast as a small map beside it.
# GMGSI posts each hour's mosaic about 40-55 minutes after the hour, so the job runs at :50.
on:
  schedule:
    - cron: "50 * * * *"
  workflow_dispatch:

permissions:
  contents: write     # the run log (log.csv) is committed after each run
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  clouds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install --quiet pillow numpy

      - name: Fetch the newest NOAA GMGSI longwave infrared mosaic (nowCOAST WMS)
        id: fetch
        run: |
          set -euo pipefail
          OWS='https://nowcoast.noaa.gov/geoserver/observations/satellite/ows'
          # the mosaic's own time, so clouds.json says when the clouds were seen, and an old mosaic is never published as new
          T=$(curl -sS --max-time 90 "$OWS?service=WMS&request=GetCapabilities&version=1.3.0" | python mosaic_time.py global_longwave_imagery_mosaic)
          T0=$(date -u -d "$T" +%Y-%m-%dT%H:%M:%SZ)
          age=$(( $(date -u +%s) - $(date -u -d "$T" +%s) ))
          echo "newest mosaic: $T0 ($((age / 60)) min old)"
          if [ "$age" -gt 10800 ]; then echo "older than 3 h: not publishing it (the page then falls back to its static clouds after 12 h)"; exit 1; fi
          prev=$(curl -sS --max-time 30 "https://gentakestudio.github.io/rr-clouds/clouds.json" 2>/dev/null | python -c "import sys,json; print(json.load(sys.stdin).get('t',''))" 2>/dev/null || true)
          if [ "$prev" = "$T0" ]; then echo "already published"; echo "new=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          URL="$OWS?service=WMS&request=GetMap&version=1.3.0&layers=global_longwave_imagery_mosaic&styles=&crs=CRS:84&bbox=-180,-90,180,90&width=4096&height=2048&format=image/png&transparent=true&time=$T"
          for i in 1 2 3 4; do
            # errors come back as HTTP 200 with an XML body, so the type and size are checked too
            if curl -sS --max-time 120 -D headers.txt -o gmgsi.png "$URL" \
               && grep -qi '^content-type: image/png' headers.txt \
               && [ "$(stat -c%s gmgsi.png)" -gt 500000 ]; then break; fi
            echo "attempt $i failed"; rm -f gmgsi.png; sleep $((30 * i))
          done
          test -s gmgsi.png
          { echo "new=true"; echo "t=$T0"; echo "v=$(date -u -d "$T" +%Y%m%d%H)"; } >> "$GITHUB_OUTPUT"

      - name: Build the cloud mask
        if: steps.fetch.outputs.new == 'true'
        id: build
        run: |
          set -euo pipefail
          mkdir -p site
          stats=$(python make_clouds.py gmgsi.png static_clouds4k.webp site)   # exits non-zero (nothing published) if the sanity checks fail
          echo "$stats"
          test -s site/clouds2k.webp && test -s site/clouds4k.webp
          # the aurora forecast (NOAA SWPC OVATION) rides along; if it fails the clouds still go out, just without it
          AT=""
          if curl -sS --max-time 60 -o ovation.json https://services.swpc.noaa.gov/json/ovation_aurora_latest.json && A=$(python make_aurora.py ovation.json site); then echo "aurora: $A"; AT=$(echo "$A" | cut -d' ' -f2); else echo "aurora: skipped"; fi
          if [ -n "$AT" ]; then AUR=",\"aurora\":\"aurora.webp\",\"at\":\"$AT\""; else AUR=""; fi
          # NASA/JPL asteroid and comet flybys for "today in the sky" (sky.json); optional like the aurora
          D0=$(date -u -d '-2 day' +%Y-%m-%d)
          if curl -sS --max-time 60 -o cad_a.json "https://ssd-api.jpl.nasa.gov/cad.api?date-min=$D0&date-max=%2B14&dist-max=0.05&fullname=true&diameter=true" && curl -sS --max-time 60 -o cad_c.json "https://ssd-api.jpl.nasa.gov/cad.api?date-min=$D0&date-max=%2B30&dist-max=1&kind=c&fullname=true" && SK=$(python make_sky.py cad_a.json cad_c.json site); then echo "sky: $SK"; AUR="$AUR,\"sky\":\"sky.json\""; else echo "sky: skipped"; fi
          # background radiation from Safecast for the Classic skin (rad.json); optional like the aurora. 30 archive cells are refreshed each run
          B=https://gentakestudio.github.io/rr-clouds
          if R=$(timeout 300 python make_rad.py site/rad.json 30); then echo "$R"; else echo "rad: skipped"; curl -sSf --max-time 60 -o site/rad.json "$B/rad.json" || rm -f site/rad.json; fi   # each deploy replaces the whole site, so the last file is carried over
          # the real sun (NASA SDO/AIA 171) for the Emerald skin: six frames of the last ten hours. Optional like the aurora; if NASA has no good frames the last good picture is carried over the same way
          if S=$(timeout 200 python make_sun.py site); then echo "sun: $S"; ST=$(echo "$S" | cut -d' ' -f2)
          else echo "sun: skipped"; ST=$(curl -sS --max-time 30 "$B/clouds.json" 2>/dev/null | python -c "import sys,json; print(json.load(sys.stdin).get('sunT',''))" 2>/dev/null || true)
            if [ -n "$ST" ] && ! curl -sSf --max-time 60 -o site/sun.webp "$B/sun.webp"; then ST=""; fi
          fi
          if [ -n "$ST" ]; then AUR="$AUR,\"sun\":\"sun.webp\",\"sunT\":\"$ST\""; fi
          printf '{"t":"%s","v":"%s","src":"NOAA GMGSI","f2k":"clouds2k.webp","f4k":"clouds4k.webp"%s}\n' "${{ steps.fetch.outputs.t }}" "${{ steps.fetch.outputs.v }}" "$AUR" > site/clouds.json
          cp index.html site/
          touch site/.nojekyll
          echo "stats=$(echo "$stats" | tail -1 | cut -d' ' -f2-3 | tr ' ' ',')" >> "$GITHUB_OUTPUT"

      - if: steps.fetch.outputs.new == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - if: steps.fetch.outputs.new == 'true'
        id: deploy
        uses: actions/deploy-pages@v5

      - name: Check the published files
        if: steps.fetch.outputs.new == 'true'
        run: |
          set -euo pipefail
          base="${{ steps.deploy.outputs.page_url }}"
          sleep 20
          curl -sSf -o /dev/null "${base}clouds.json"
          curl -sSf -o /dev/null "${base}clouds2k.webp"

      - name: Commit the run log
        if: steps.fetch.outputs.new == 'true'
        run: |
          set -euo pipefail
          echo "${{ steps.fetch.outputs.t }},$(date -u +%Y-%m-%dT%H:%M:%SZ),${{ steps.build.outputs.stats }}" >> log.csv
          { head -n 1 log.csv; tail -n +2 log.csv | tail -n 1999; } > log.tmp && mv log.tmp log.csv   # the header stays
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add log.csv rad_grid.json rad_imports.json
          git commit -m "Clouds ${{ steps.fetch.outputs.t }}"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && exit 0; sleep 5; done
          exit 1
